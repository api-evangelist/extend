                    type: boolean
                    description: Flag that tracks whether the transaction was created as a test or not. NOTE - This is defaulted to false and should be used only under special circumstances.
                    example: false
                  limitOfLiabilityAmount:
                    type: number
                    description: Limit of liability amount of the contract.
                    example: 1999
                  limitOfLiabilityAmountType:
                    type: string
