                          purchaseDate:
                            type: number
                            description: Purchase date of the contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                            example: 1651787620000
                          purchasePrice:
                            type: number
                            description: Purchase price of the plan purchased.
                            example: 1999
                          refundedAt:
                            type: number
                            description: Date the contract was refunded at. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                            example: 1651787679000
                          resellerMerchant:
                            type: object
                            description: Data related to reseller merchants. This can be used by merchants when different store information from the merchant’s Extend store must be displayed to customers.
                            properties:
                              id:
                                type: string
                                description: Unique identifier from merchant’s system for the reseller merchant account.
                                example: 154ebea0-6c1b-46a4-b166-032246330526
                              name:
                                type: string
                                description: Reseller merchant store name.
                                example: Acme Reseller Company
                              domain:
                                type: string
                                description: Main website URL for reseller merchant store.
                                example: https://acme.reseller.com
                          saleOrigin:
                            type: object
                            description: ''
                            properties:
                              agentId:
                                type: string
                                description: An identifier for an individual agent for tracking their sales.
                                example: sales agent
                              channel:
                                type: string
                                description: Sales channel
                                example: web
                              integratorId:
                                type: string
                                description: An identifier for an individual integrator
                              locationId:
                                type: string
                                description: The specific location that the sale originated from.
                                example: 'Store #123'
                              platform:
                                type: string
                                description: Ecommerce platform sale came from
                                example: BigCommerce
                              storeAddress:
                                type: object
                                properties:
                                  address1:
                                    type: string
                                    description: Customer's address.
                                    example: 535 Mission Street
                                  address2:
                                    type: string
                                    description: 'Customer''s PO or Unit #.'
                                    example: 11th Floor
                                  city:
                                    type: string
                                    description: Customer's city.
                                    example: San Francisco
                                  countryCode:
                                    type: string
                                    example: US
                                    description: Customer’s address country code. NOTE - This should be in a two letter format (e.g. United States = US).
                                  postalCode:
                                    type: string
                                    description: Customer's postal code.
                                    example: '94526'
                                  province:
                                    type: string
                                    example: CA
                                    description: Customer's state / province.
                          sellerId:
                            type: string
                            description: Unique identifier for the merchant’s Extend store (i.e. the merchant’s Extend Store ID).
                            example: 598b11f3-5514-42f8-bdd5-e13ae866635a
                          sellerName:
                            type: string
                            description: Merchant’s company or store name.
                            example: Quality Crafts
                          status:
                            type: string
                            description: Contract status.
                            enum:
                            - cancelled
                            - created
                            - delivered
                            - expired
                            - fulfilled
                            - live
                            - refund_accepted
                            - refund_denied
                            - refund_paid
                            - refund_requested
                            - voided
                            - pending_termination
                            - terminated
                            example: live
                          transactionId:
                            type: string
                            description: Unique identifier provided by the merchant of the transaction when the contract is purchased.
                            example: '123928374327464'
                          type:
                            type: string
                            description: Filter for including contract types. NOTE - PCRS is the contract type for extended warranty contracts.
                            enum:
                            - pcrs
                            example: pcrs
                          updatedAt:
                            type: number
                            description: Date the contract was last updated at. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                            example: 1651787679000
                          charitableDonation:
                            type: object
                            description: An object that stores data related to a charitable donation that a customer made.
                            required:
                            - id
                            - donationAmount
                            properties:
                              id:
                                type: string
                                description: Unique identifier for the charity organization.
                                example: 598b11f3-5514-42f8-bdd5-e13ae866635a
                              name:
                                type: string
                                description: Name of the charity organization.
                              donationAmount:
                                type: number
                                description: Amount donated to the charity organization.
                          cancellationReason:
                            type: string
                            description: Why the contract was cancelled.
                            enum:
                            - fraud_identified
                            - merchant_refund
                            - sp_claim
                            - correction_needed
                            - customer_requested
                            - merchant_requested
                            - created_in_error
                            - goodwill_escalation
                          refundMethod:
                            type: string
                            description: The method by which a contract was refunded to the customer.
                            enum:
                            - extend_ach
                            - merchant_issued
                            - no_refund_issued
                          refundPayment:
                            type: object
                            properties:
                              source:
                                type: string
                              refundRequestId:
                                type: string
                              refundSourceId:
                                type: string
                              refundId:
                                type: string
                              rewardId:
                                type: string
                              status:
                                type: string
                                enum:
                                - pending
                                - canceled
                                - complete
                                - failed
                              failureReason:
                                type: string
                              payment:
                                type: object
                                required:
                                - value
                                - currency
                                properties:
                                  value:
                                    type: number
                                  currency:
                                    type: string
                              recipient:
                                type: object
                                required:
                                - name
                                properties:
                                  name:
                                    type: string
                                    description: Recipient's name.
                                  email:
                                    type: string
                                    description: Recipient's email address.
                                  phone:
                                    type: string
                                    description: Recipient's phone number.
                              invoiceId:
                                type: string
                              createdAt:
                                type: number
                              updatedAt:
                                type: number
                              delivery:
                                type: object
                                required:
                                - method
                                - status
                                - deliverAt
                                properties:
                                  method:
                                    type: string
                                    enum:
                                    - email
                                    - sms
                                  status:
                                    type: string
                                    enum:
                                    - scheduled
                                    - failed
                                    - complete
                                    - pending
                                  deliverAt:
                                    type: number
                              customFields:
                                type: array
                                items:
                                  type: object
                                  additionalProperties:
                                    type: string
                            required:
                            - source
                            - refundRequestId
                            - refundSourceId
