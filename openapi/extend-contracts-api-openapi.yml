      responses:
        '200':
          description: Successful contract update. Note - This is an example response for an extended warranty contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    description: Account ID for the merchant in Extend’s system.
                    example: f36feabf-d024-431f-9506-32bfcada1231
                  adminContractId:
                    type: string
                    description: Unique identifier for the Extend contract that is generated in PCRS. NOTE - This is only applicable for the PCRS contract type.
                    example: '1001609401'
                  adminSyncError:
                    type: string
                    description: Error message from PCRS when an Extend contract cannot be successfully synced.
                    example: 'Update Error: PcmiError: Contract plan expected price is not set, try re-syncing'
                  adminSyncStatus:
                    type: string
                    description: Status of contract syncing to PCRS system. NOTE - This is only applicable for the PCRS contract type.
                    enum:
                    - sync_error
                    - synced
                    - unsynced
                    - resync_required
                    example: synced
                  merchantCustomerId:
                    type: string
                    description: Unique identifier for the customer in the merchant’s system.
                    example: c57ed096-24ef-49a4-a20a-d1b8bf770980
                  cancelledAt:
                    type: number
                    description: Cancelation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                    example: 1651787627000
                  createdAt:
                    type: number
                    description: Creation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                    example: 1651787624000
                  consumerProfileId:
                    type: string
                    description: Unique identifier for the consumer profile in Extend’s system.
                    example: f36feabf-d024-431f-9506-32bfcada1231
                  coverage:
                    type: object
                    required:
                    - starts
                    - ends
                    properties:
                      starts:
                        type: number
                        description: Coverage start date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                        example: 1651787621000
                      ends:
                        type: number
                        description: Coverage end date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                        example: 1683323621000
                  customer:
                    type: object
                    properties:
                      billingAddress:
                        description: Customer’s billing address.
                        type: object
                        required:
                        - address1
                        - city
                        - countryCode
                        - postalCode
                        properties:
                          address1:
                            type: string
                            description: Customer’s address line 1.
                            example: 535 Mission Street
                          address2:
                            type: string
                            description: Customer’s address line 2.
                            example: 11th Floor
                          city:
                            type: string
                            description: Customer’s address city
                            example: San Francisco
                          countryCode:
                            type: string
                            description: Customer’s address country code. NOTE - This should be in a two letter format (e.g. United States = US).
                            example: US
                          postalCode:
                            type: string
                            description: Customer’s address postal code.
                            example: '94526'
                          provinceCode:
                            type: string
                            description: Customer’s address state or province code.
                            example: CA
                      email:
                        type: string
                        description: Customer’s email address.
                        example: bobross@gmail.com
                      name:
                        type: string
                        description: Customer’s full name.
                        example: Bob Ross
                      phone:
                        type: string
                        description: Customer’s primary phone number.
                        example: 123-456-7890
                      shippingAddress:
                        description: Customer’s shipping address.
                        type: object
                        required:
                        - address1
                        - city
                        - countryCode
                        - postalCode
                        properties:
                          address1:
                            type: string
                            description: Customer’s address line 1.
                            example: 535 Mission Street
                          address2:
                            type: string
                            description: Customer’s address line 2.
                            example: 11th Floor
                          city:
                            type: string
                            description: Customer’s address city
                            example: San Francisco
                          countryCode:
                            type: string
                            description: Customer’s address country code. NOTE - This should be in a two letter format (e.g. United States = US).
                            example: US
                          postalCode:
                            type: string
                            description: Customer’s address postal code.
                            example: '94526'
                          provinceCode:
                            type: string
                            description: Customer’s address state or province code.
                            example: CA
                      type:
                        type: string
                        description: Type of customer on the contract sold.
                        enum:
                        - consumer
                        example: consumer
                      locale:
                        type: string
                        description: 'The locale of the customer. Locale is used to determine the language of the offer marketing content. Locale is formatted as xx-XX: the first two letters denote language, (ISO 639-1 standards) and the last two letters denote region (ISO 3166 standards).'
                        example: en-US
                      region:
                        type: string
                        description: Region of the customer's location when an order is processed by the merchant (an ISO 3166-1 region code). This value is the country of the customer's location.
                        example: US
                      subdivision:
                        type: string
                        description: Subdivision of the customer's location when an order is processed by the merchant. This value is the state or province of the customer's location.
                        example: CA
                    required:
                    - name
                    - type
                  formId:
                    type: string
                    description: This field is used for Jewelry orders where merchants need to provide additional reporting and analytics context for the order.
                    example: 1ADJ
                  id:
                    type: string
                    description: Unique identifier for an Extend contract.
                    example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
                  isProductWarrantabilityVerified:
                    type: boolean
                    description: Indicates whether our system skipped product warrantability validation when creating a contract.
                    example: true
