    put:
      summary: Update Contract
      description: <p>This endpoint updates a contract using the Contract ID. Information that can be updated for a contract includes coverage, customer, plan, and product details associated with the contract.</p><p>Given the new contract type of shipping protection, there are two different bodies that can be used to perform the contract update. When a shipping protection contract needs to be updated, the body will include tracking/shipment information and a list of products covered under the shipping protection plan instead of the one product that would be applicable with extended warranty contracts. Additional details on the various fields that can be updated are outlined in the options below.</p>
      operationId: contractsUpdate
      tags:
      - Contracts
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=2022-02-01
      - name: contractId
        required: true
        in: path
        description: Unique identifier for Extend contract.
        schema:
          type: string
          format: uuid
          example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
