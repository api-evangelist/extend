  /contracts/{contractId}:
    get:
      summary: Get Contract by ID
      description: <p>This endpoint retrieves a contract using the Contract ID. Information that can be retrieved for a contract includes coverage, customer, plan, and product details associated to the contract.</p><p>Given the new contract type of shipping protection, there are two different response bodies that can be returned. When a shipping protection contract is retrieved, the response body will also include tracking/shipment information and a list of products covered under the shipping protection plan instead of the one product that would be returned with extended warranty contracts. Additional details on the different response bodies is outlined in the successful response examples below.</p>
      operationId: contractsGet
      tags:
      - Contracts
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: contractId
        required: true
        in: path
        description: Unique identifier for Extend contract.
        schema:
          type: string
          format: uuid
          example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
      responses:
        '200':
          description: Successfully retrieved contract
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - type: object
                    properties:
                      accountId:
                        type: string
                        description: Account ID for the merchant in Extend’s system.
                        example: f36feabf-d024-431f-9506-32bfcada1231
                      adminContractId:
                        type: string
                        description: Unique identifier for the Extend contract that is generated in PCRS. NOTE - This is only applicable for the PCRS contract type.
                        example: '1001609401'
                      adminSyncError:
                        type: string
                        description: Error message from PCRS when an Extend contract cannot be successfully synced.
                        example: 'Update Error: PcmiError: Contract plan expected price is not set, try re-syncing'
                      adminSyncStatus:
                        type: string
                        description: Status of contract syncing to PCRS system. NOTE - This is only applicable for the PCRS contract type.
                        enum:
                        - sync_error
                        - synced
                        - unsynced
                        - resync_required
                        example: synced
                      merchantCustomerId:
                        type: string
                        description: Unique identifier for the customer in the merchant’s system.
                        example: c57ed096-24ef-49a4-a20a-d1b8bf770980
                      cancelledAt:
                        type: number
                        description: Cancelation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                        example: 1651787627000
                      createdAt:
                        type: number
                        description: Creation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                        example: 1651787624000
                      consumerProfileId:
                        type: string
                        description: Unique identifier for the consumer profile in Extend’s system.
                        example: f36feabf-d024-431f-9506-32bfcada1231
                      coverage:
                        type: object
                        required:
                        - starts
                        - ends
                        properties:
                          starts:
                            type: number
                            description: Coverage start date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                            example: 1651787621000
                          ends:
                            type: number
                            description: Coverage end date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                            example: 1683323621000
