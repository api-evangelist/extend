                        category:
                          type: string
                          description: Plan category (e.g. indoor_furniture, consumer_electronics).
                          example: consumer_electronics
                        coverage_includes:
                          type: string
                          description: Indicates whether plan includes Accidental Damage from Handling (ADH) or only base coverage (e.g. ‘adh', 'base’).
                          example: adh
                        coverage_starts:
                          type: string
                          description: Indicates whether plan starts immediately when contract is purchased or after the manufacturer’s warranty period ends (e.g. ‘immediate', 'after’).
                          example: immediate
                        deductible:
                          type: number
                          description: Deductible the customer is responsible for on plan when a claim is placed.
                          example: 0
                        pcmi_category:
                          type: string
                          description: Category associated to the plan in PCRS (e.g. Furniture, Household Goods).
                          example: ''
                        pcmi_subcategory:
                          type: string
                          description: Subcategory associated to the plan in PCRS (e.g. Mattress, Area Rug).
                          example: General Electronic Devices
                        servicer_ids:
                          type: array
                          description: Servicer IDs in PCRS that are associated to the plan.
                          items:
                            type: string
                          example: []
                        replacement_type:
                          type: string
                          description: Indicates whether the replacement sourced must be a new or used product (e.g. ‘new’, 'used’).
                          example: new
                        service_type:
                          type: string
                          description: Indicates the type of service that the plan is eligible for when a claim is placed. This primarily determines if the product under the plan will be repaired or replaced. If repaired, this field will indicate the type of repair that will be attempted (e.g. on-site, depot, etc.).
                          enum:
                          - repair
                          - replace
                          - repair_depot
                          - repair_onsite
                          - repair_irobot
                          example: replace
