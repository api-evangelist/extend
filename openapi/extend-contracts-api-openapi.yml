                        example: 1651787629000
                      purchasePrice:
                        type: number
                        description: Purchase price of the product purchased
                        example: 3999
                      referenceId:
                        type: string
                        description: Unique identifier provided by the merchant for the product.
                        example: SKU-123-456
                      reimbursementAmount:
                        type: number
                        description: Amount that Extend will reimburse on approved claims for the product if it is different from the product’s list price.
                        multipleOf: 1
                        example: 3999
                      serialNumber:
                        type: string
                        description: Product serial number.
                        example: ABCD123456
                      name:
                        type: string
                        description: Name or title of the product.
                        example: Wireless Headphones
                      transactionId:
                        type: string
                        description: Unique identifier provided by the merchant of the original order when the product is purchased. NOTE - This ID is automatically passed to a contract from Transaction ID that is provided on an Extend order.
                        example: '6789876212'
