openapi: 3.0.1
info:
  version: 7.0.0
  title: Contracts Api
  description: '<p>When a customer buys an extended warranty or protection plan for their product, they are purchasing a warranty Contract. Your store needs to record all new warranty plan purchases with Extend so we can create a new contract and deliver it to the customer. You will also need to record any warranty returns / refunds so we can cancel the contract and account for the refunded amount.</p><p>You can record the warranty plan purchase by creating a new warranty contract. For returns, you issue a request for a warranty contract refund. See below for more details!</p><div class=''wrapper important''><h2>Important:</h2>


    If you are selling a warranty contract <b>after</b> the purchase of a product, you need to include a lead token in the request. To learn more about post-purchase warranties and leads, please see the Leads API section.</div>'
servers:
- url: https://api.helloextend.com
paths:
  /contracts/search:
    get:
      summary: Search Contracts
      description: This endpoint allows search via querystring params. <p>The search queries include:</p><ul><li>typeFilter</li><li>contractId</li><li>customerEmail</li><li>customerPhone</li><li>productSerialNumber</li><li>productTransactionId</li><li>sellerId</li><li>status</li><li>transactionId</li></ul><p>The search term `sellerId` can be paired with any of the other terms to limit contracts by seller.</p><p>`sellerId` is a required querystring parameter.</p>
      operationId: contractsSearch
      tags:
      - Contracts
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=2022-02-01
      - name: typeFilter
        in: query
        description: Filter for including contract types. NOTE - PCRS is the contract type for extended warranty contracts.
        schema:
          type: string
          enum:
          - pcrs
          - shipping_protection
          - category
          - pcrs,shipping_protection
          - shipping_protection,pcrs
          - pcrs,shipping_protection,category
          - shipping_protection,category
          - pcrs,category
      - name: contractId
        in: query
        description: Unique identifier for an Extend contract.
        schema:
          type: string
          format: uuid
          example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
      - name: customerEmail
        in: query
        description: Email of customer who purchased the contract.
        schema:
          type: string
          format: string
          example: customer@extend.com
      - name: customerPhone
        in: query
        description: Phone number of customer who purchased the contract.
        schema:
          type: string
          format: string
          example: 415-123-4567
      - name: merchantCustomerId
        in: query
        description: Unique identifier for the customer in the merchant’s system.
        schema:
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
          type: string
      - name: productSerialNumber
        in: query
        description: Serial number of product purchased.
        schema:
          type: string
          example: OEF2B1
      - name: productTransactionId
        in: query
        description: Unique identifier provided by merchant for transaction associated to the product covered by the Extend contract.
        schema:
          type: string
          example: 123EY1
      - name: sellerId
        in: query
        description: Unique identifier for merchant’s store in Extend’s system.
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - name: status
        in: query
        description: Status of contract.
        schema:
          type: string
          enum:
          - cancelled
          - created
          - expired
          - fulfilled
          - live
          - refund_accepted
          - refund_denied
          - refund_paid
          - refund_requested
          - terminated
          - pending_termination
          - voided
          example: live
      - name: transactionId
        in: query
        description: Unique identifier provided by merchant for transaction associated to Extend contract purchased.
        schema:
          type: string
          example: 123EY1
      - name: showAll
        in: query
        description: Use the value <code>true</code> to return all the product info and plan details.
        schema:
          type: boolean
          example: 'true'
      responses:
        '200':
          description: Successfully returned search result. Note - This is an example response for an extended warranty contract.
          content:
            application/json:
              schema:
                type: object
                required:
                - contracts
                properties:
                  contracts:
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          accountId:
                            type: string
                            description: Account ID for the merchant in Extend’s system.
                            example: f36feabf-d024-431f-9506-32bfcada1231
                          adminContractId:
                            type: string
                            description: Unique identifier for the Extend contract that is generated in PCRS. NOTE - This is only applicable for the PCRS contract type.
                            example: '1001609401'
                          adminSyncError:
                            type: string
                            description: Error message from PCRS when an Extend contract cannot be successfully synced.
                            example: 'Update Error: PcmiError: Contract plan expected price is not set, try re-syncing'
                          adminSyncStatus:
                            type: string
                            description: Status of contract syncing to PCRS system. NOTE - This is only applicable for the PCRS contract type.
                            enum:
                            - sync_error
                            - synced
                            - unsynced
                            - resync_required
                            example: synced
                          merchantCustomerId:
                            type: string
                            description: Unique identifier for the customer in the merchant’s system.
                            example: c57ed096-24ef-49a4-a20a-d1b8bf770980
                          cancelledAt:
                            type: number
                            description: Cancelation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                            example: 1651787627000
                          createdAt:
                            type: number
                            description: Creation date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                            example: 1651787624000
                          consumerProfileId:
                            type: string
                            description: Unique identifier for the consumer profile in Extend’s system.
                            example: f36feabf-d024-431f-9506-32bfcada1231
                          coverage:
                            type: object
                            required:
                            - starts
                            - ends
                            properties:
                              starts:
                                type: number
                                description: Coverage start date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                                example: 1651787621000
                              ends:
                                type: number
                                description: Coverage end date of the Extend contract. NOTE - This field is formatted as a 13 digit Epoch timestamp. This value is dynamically calculated based on the Product Transaction Date and Manufacturer Warranty Length (parts and labor) values.
                                example: 1683323621000
                          customer:
                            type: object
                            properties:
                              billingAddress:
                                description: Customer’s billing address.
                                type: object
                                required:
                                - address1
                                - city
                                - countryCode
                                - postalCode
                                properties:
                                  address1:
                                    type: string
                                    description: Customer’s address line 1.
                                    example: 535 Mission Street
                                  address2:
                                    type: string
                                    description: Customer’s address line 2.
                                    example: 11th Floor
                                  city:
                                    type: string
                                    description: Customer’s address city
                                    example: San Francisco
                                  countryCode:
                                    type: string
                                    description: Customer’s address country code. NOTE - This should be in a two letter format (e.g. United States = US).
                                    example: US
                                  postalCode:
                                    type: string
                                    description: Customer’s address postal code.
                                    example: '94526'
                                  provinceCode:
                                    type: string
                                    description: Customer’s address state or province code.
                                    example: CA
                              email:
                                type: string
                                description: Customer’s email address.
                                example: bobross@gmail.com
                              name:
                                type: string
                                description: Customer’s full name.
                                example: Bob Ross
                              phone:
                                type: string
                                description: Customer’s primary phone number.
                                example: 123-456-7890
                              shippingAddress:
                                description: Customer’s shipping address.
                                type: object
                                required:
                                - address1
                                - city
                                - countryCode
                                - postalCode
                                properties:
                                  address1:
                                    type: string
                                    description: Customer’s address line 1.
                                    example: 535 Mission Street
                                  address2:
                                    type: string
                                    description: Customer’s address line 2.
                                    example: 11th Floor
                                  city:
                                    type: string
                                    description: Customer’s address city
                                    example: San Francisco
                                  countryCode:
                                    type: string
                                    description: Customer’s address country code. NOTE - This should be in a two letter format (e.g. United States = US).
                                    example: US
                                  postalCode:
                                    type: string
                                    description: Customer’s address postal code.
                                    example: '94526'
                                  provinceCode:
                                    type: string
                                    description: Customer’s address state or province code.
                                    example: CA
                              type:
                                type: string
                                description: Type of customer on the contract sold.
                                enum:
                                - consumer
                                example: consumer
                              locale:
                                type: string
                                description: 'The locale of the customer. Locale is used to determine the language of the offer marketing content. Locale is formatted as xx-XX: the first two letters denote language, (ISO 639-1 standards) and the last two letters denote region (ISO 3166 standards).'
                                example: en-US
                              region:
                                type: string
                                description: Region of the customer's location when an order is processed by the merchant (an ISO 3166-1 region code). This value is the country of the customer's location.
                                example: US
                              subdivision:
                                type: string
                                description: Subdivision of the customer's location when an order is processed by the merchant. This value is the state or province of the customer's location.
                                example: CA
                            required:
                            - name
                            - type
                          formId:
                            type: string
                            description: This field is used for Jewelry orders where merchants need to provide additional reporting and analytics context for the order.
                            example: 1ADJ
                          id:
                            type: string
                            description: Unique identifier for an Extend contract.
                            example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
                          isProductWarrantabilityVerified:
                            type: boolean
                            description: Indicates whether our system skipped product warrantability validation when creating a contract.
                            example: true
                          isTest:
                            type: boolean
                            description: Flag that tracks whether the transaction was created as a test or not. NOTE - This is defaulted to false and should be used only under special circumstances.
                            example: false
                          limitOfLiabilityAmount:
                            type: number
                            description: Limit of liability amount of the contract.
                            example: 1999
                          limitOfLiabilityAmountType:
                            type: string
                            enum:
                            - product_purchase_price
                            - product_list_price
                            description: Price that the contract limit of liability is based on.
                            example: product_purchase_price
                          listPrice:
                            type: number
                            description: Expected retail price of the Extend plan associated to the contract purchased.
                            example: 1999
                          orderId:
                            type: string
                            description: Unique identifier for an Extend order.
                            example: 9778f161-9530-491a-bfdc-5c45214c0a6c
                          lineItemTransactionId:
                            type: string
                            description: Unique identifier for an Extend order line item's transaction, provided by the merchant.
                            example: line-item-txn-12345
                          plan:
                            type: object
                            properties:
                              category:
                                type: string
                                description: Plan category type.
                                enum:
                                - service_contract
                                - shipping_contract
                              id:
                                type: string
                                description: Unique identifier for Extend plan.
                                example: 10001-misc-elec-adh-replace-1y
                              skuId:
                                type: string
                                description: Unique identifier for SKU that is used by merchants when selling Extend plans.
                                example: EXT123
                              termsId:
                                type: string
                                description: Unique identifier for the terms associated to the Extend plan.
                                example: 154ebea0-6c1b-46a4-b166-032246330526
                              termsVersion:
                                type: string
                                description: Version number for the terms associated to the Extend plan.
                                example: '1'
                              version:
                                type: number
                                description: Version number of the Extend plan.
                                multipleOf: 1
                                example: 1
                            required:
                            - category
                            - id
                          poNumber:
                            type: string
                            example: ABC-123
                            description: An optional merchant generated purchase order number used for reconciliation
                          product:
                            type: object
                            properties:
                              fulfillmentDate:
                                type: number
                                description: Date when a customer has received a product. This can be applicable for any instance where the customer receives a product on a date after the order is placed. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                                example: 1651787629000
                              imageUrl:
                                type: string
                                description: URL specifying the location of the primary image for the product.
                              listPrice:
                                type: number
                                description: Retail price of the product purchased.
                                example: 3999
                              manufacturerWarrantyLengthLabor:
                                type: number
                                description: Length of manufacturer warranty on labor for the product, expressed in number of months.
                                example: 6
                              manufacturerWarrantyLengthParts:
                                type: number
                                description: Length of manufacturer warranty on parts for the product, expressed in number of months.
                                example: 6
                              purchaseDate:
                                type: number
                                description: Purchase date of the product. NOTE - This field is formatted as a 13 digit Epoch timestamp.
                                example: 1651787629000
                              purchasePrice:
                                type: number
                                description: Purchase price of the product purchased
                                example: 3999
                              referenceId:
                                type: string
                                description: Unique identifier provided by the merchant for the product.
                                example: SKU-123-456
                              reimbursementAmount:
                                type: number
                                description: Amount that Extend will reimburse on approved claims for the product if it is different from the product’s list price.
                                multipleOf: 1
                                example: 3999
                              serialNumber:
                                type: string
                                description: Product serial number.
                                example: ABCD123456
                              name:
                                type: string
                                description: Name or title of the product.
                                example: Wireless Headphones
                              transactionId:
                                type: string
                                description: Unique identifier provided by the merchant of the original order when the product is purchased. NOTE - This ID is automatically passed to a contract from Transaction ID that is provided on an Extend order.
                                example: '6789876212'
                            required:
                            - fulfillmentDate
                            - listPrice
                            - manufacturerWarrantyLengthLabor
                            - manufacturerWarrantyLengthParts
                            - purchaseDate
                            - purchasePrice
                            - referenceId
                            - name
                            - transactionId
                          purchaseCurrency:
                            description: Currency code used when contract was purchased. NOTE - This is an ISO-4217 currency code.
                            example: USD
                            type: string
                            enum:
                            - AED
                            - AFN
                            - ALL
                            - AMD
                            - ANG
                            - AOA
                            - ARS
                            - AUD
                            - AWG
                            - AZN
                            - BAM
                            - BBD
                            - BDT
                            - BGN
                            - BHD
                            - BIF
                            - BMD
                            - BND
                            - BOB
                            - BOV
                            - BRL
                            - BSD
                            - BTN
                            - BWP
                            - BYN
                            - BZD
                            - CAD
