                        type: string
                        enum:
                        - pound
                        - ounce
                        - gram
                        - kilogram
                  condition:
                    type: string
                    enum:
                    - new
                    - used
                    - refurbished
                  imageUrl:
                    type: string
                    description: A url pointing to the primary image for the product.
                  price:
                    description: The base retail price of the product (in cents for USD). Price is required to sell warranties on a product.
                    allOf:
                    - type: object
                      required:
                      - amount
                      properties:
                        amount:
                          type: number
                          multipleOf: 1
                          minimum: 0
