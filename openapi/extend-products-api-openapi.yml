openapi: 3.2.0
info:
  title: Api Products API
  description: 'A Product object represents an item available for sale in your store. In order for us to assign warranty plans to your products, you first need to sync your store''s products to Extend through a POST request via REST API.


    Please be sure to keep your products in sync! We can only match warranty plans to the products you sync to the Extend platform, and can only match plans as accurately as the product data we receive from you.'
  version: '2022-02-01'
servers:
- url: https://api.helloextend.com
tags:
- name: Products
paths:
  /stores/{storeId}/products:
    post:
      tags:
      - Products
      summary: Create / update a product
      description: This will create a product if it doesn't exist or update a product that does.
      operationId: storesProductsCreate
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=latest
      - name: storeId
        in: path
        required: true
        description: Unique identifier for a store on Extend
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - required: false
        name: batch
        in: query
        description: Use the value <code>true</code> if passing a batch of products.
        schema:
          type: boolean
          example: 'true'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - title: CREATE/UPDATE PRODUCT (OBJECT)
                description: A single product create/update.
                type: object
                required:
                - referenceId
                - title
                additionalProperties: false
                properties:
                  brand:
                    type: string
                    description: The Product Brand, Manufacturer or Vendor.
                  category:
                    type: string
                    description: Product category. Can be any value and may be used by Extend to map the product to warranty plans.
                  subCategories:
                    type: array
                    description: An array of additional product categories.
                  description:
                    type: string
                    maxLength: 2000
                    description: The product description.
                  enabled:
                    type: boolean
                    readOnly: true
                  modelNumber:
                    type: string
                  itemDimensions:
                    type: object
                    properties:
                      height:
                        type: number
                        minimum: 0
                        multipleOf: 0.01
                      width:
                        type: number
                        minimum: 0
                        multipleOf: 0.01
                      length:
                        type: number
                        minimum: 0
                        multipleOf: 0.01
                      unit:
