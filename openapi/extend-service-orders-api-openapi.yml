openapi: 3.2.0
info:
  title: Api Service Orders API
  version: 1.0.0
servers:
- url: https://api.helloextend.com
tags:
- name: service-orders
paths:
  /service-orders/search:
    get:
      summary: Find service orders associated with a given claim ID or Service Order Id.
      tags:
      - service-orders
      parameters:
      - name: claimId
        in: query
        description: Unique identifier for a claim
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - name: includeShippingLabels
        in: query
        schema:
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: serviceOrderId
        in: query
        description: Unique identifier for a service order
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - name: limit
        in: query
        description: Amount of results to return
        schema:
          type: number
      - name: cursor
        in: query
        description: Amount of results to skip
        schema:
          type: number
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=latest
      responses:
        '200':
          description: Returns an array of service orders associated with a given claim Id or service order Id
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - body
                  properties:
                    body:
                      allOf:
                      - type: object
                        required:
                        - id
                        - claimId
                        - contractId
                        - sellerId
                        - status
                        - serviceType
                        - product
                        - createdAt
                        - updatedAt
                        - totalItemsValue
                        properties:
                          id:
                            type: string
                          claimId:
                            type: string
                          contractId:
                            type: string
                          sellerId:
                            type: string
                          customerEmail:
                            type: string
                          assignedServicer:
                            type: object
                            required:
                            - servicerId
                            - authOrganizationId
                            - businessName
                            - servicingLocation
                            - servicerType
                            properties:
                              servicerId:
                                type: string
                              authOrganizationId:
                                type: string
                              businessName:
                                type: string
                              contact:
                                type: object
                                properties:
                                  email:
                                    type: string
                                  phone:
                                    type: string
                                  name:
                                    type: string
                              servicingLocation:
                                type: object
                                required:
                                - id
                                - businessName
                                - contact
                                - address
                                - createdAt
                                - updatedAt
                                properties:
                                  id:
                                    type: string
                                  businessName:
                                    type: string
                                  contact:
                                    type: object
                                    required:
                                    - email
                                    - phone
                                    - name
                                    properties:
                                      email:
                                        type: string
                                      phone:
                                        type: string
                                      name:
                                        type: string
                                  address:
                                    type: object
                                    required:
                                    - address1
                                    - city
                                    - countryCode
                                    - postalCode
                                    - provinceCode
                                    properties:
                                      address1:
                                        type: string
                                      address2:
                                        type: string
                                      city:
                                        type: string
                                      countryCode:
                                        type: string
                                      postalCode:
                                        type: string
                                      provinceCode:
                                        type: string
                                  createdAt:
                                    type: number
                                  updatedAt:
                                    type: number
                              servicerType:
                                type: string
                                enum:
                                - third-party
                                - merchant
                                - extend
                          attachments:
                            type: object
                            properties:
                              packingSlip:
                                type: object
                                properties:
                                  instructions:
                                    type: string
                                  packingSlipUrl:
                                    type: string
                          status:
                            type: string
                            enum:
                            - created
                            - accepted
                            - assigned
                            - fulfilled
                            - payment_approved
                            - payment_requested
                          serviceType:
                            type: string
                            enum:
                            - product_replacement
                            - gift_card
                            - virtual_card
                            - direct_payment
                            - carry_in
                            - cleaning_kit
                            - self_repair
                            - replace
                            - repair
                            - repair_depot
                            - repair_onsite
                            - repair_irobot
                            - automated_replacement
                          product:
                            type: object
                            required:
                            - value
                            - title
                            properties:
                              id:
                                type: string
                              value:
                                type: object
                                required:
                                - amount
                                properties:
                                  amount:
                                    description: Expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul>
                                    type: number
                                    multipleOf: 1
                                    minimum: 1
                                  currencyCode:
                                    type: string
                                    enum:
                                    - AUD
                                    - CAD
                                    - EUR
                                    - GBP
                                    - NZD
                                    - USD
                                  formattedAmount:
                                    type: string
                              title:
                                type: string
                          overrides:
                            type: object
                            properties:
                              shipping:
                                type: object
                                required:
                                - labelUrl
                                - trackingNumber
                                - carrier
                                properties:
                                  labelUrl:
                                    type: string
                                  trackingNumber:
                                    type: string
                                  carrier:
                                    type: string
                          fulfillmentMetaData:
                            oneOf:
                            - type: object
                              required:
                              - method
                              - productReferenceId
                              - productName
                              - productValue
                              properties:
                                method:
                                  type: string
                                  enum:
                                  - product_replacement
                                productReferenceId:
                                  type: string
                                productName:
                                  type: string
                                productValue:
                                  type: object
                                  required:
                                  - amount
                                  properties:
                                    amount:
                                      description: Expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul>
                                      type: number
                                      multipleOf: 1
                                      minimum: 1
                                    currencyCode:
                                      type: string
                                      enum:
                                      - AUD
                                      - CAD
                                      - EUR
                                      - GBP
                                      - NZD
                                      - USD
                                    formattedAmount:
                                      type: string
                                productReimbursementAmount:
                                  type: object
                                  required:
                                  - amount
                                  properties:
                                    amount:
                                      description: Expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul>
                                      type: number
                                      multipleOf: 1
                                      minimum: 1
                                    currencyCode:
                                      type: string
                                      enum:
                                      - AUD
                                      - CAD
                                      - EUR
                                      - GBP
                                      - NZD
                                      - USD
                                    formattedAmount:
                                      type: string
                                trackingNumber:
                                  type: string
                                carrier:
                                  type: string
                                  enum:
                                  - usps
                                  - ups
                                  - fedex_ground
                                  - dhl_express
                                  - ontrac
                                  - newgistics
                                expenseDescription:
                                  type: string
                                orderNumber:
                                  type: string
                            - type: object
                              required:
                              - method
                              properties:
                                method:
                                  type: string
                                  enum:
                                  - repair_depot
                          createdAt:
                            type: number
                          updatedAt:
                            type: number
                          repairMetaData:
                            type: object
                            properties:
                              acceptedAt:
                                type: number
                              assignedAt:
                                type: number
                              diagnosticExplanation:
                                type: string
                              diagnosticCompletedAt:
                                type: number
                              estimatedRepairCompletionAt:
                                type: number
                              repairStartedAt:
                                type: number
                              repairCompletedAt:
                                type: number
                              repairShippedAt:
                                type: number
                          paymentMetaData:
                            type: object
                            properties:
                              paymentRequestedAt:
                                type: number
                              paymentApprovedAt:
                                type: number
                              paidAt:
                                type: number
                              paymentId:
                                type: string
                          errorCode:
                            oneOf:
                            - type: string
                              enum:
                              - missing_tracking_info
                            - enum:
                              - null
                          configurations:
                            type: object
                            required:
                            - productReturnRequired
                            properties:
                              productReturnRequired:
                                type: boolean
                              isPartialReplacement:
                                type: boolean
                              hasCustomReturnLabel:
                                type: boolean
                              hasCustomDefectiveLabel:
                                type: boolean
                              rmaNumberRequired:
                                type: boolean
                              packingSlipRequired:
                                type: boolean
                              useTotalValueForAutomatedPayout:
                                type: boolean
                              isPaymentAutoApprovalEnabled:
                                type: boolean
                              autoAccept:
                                type: boolean
                              packingSlipConfiguration:
                                type: object
                                required:
                                - contractId
                                - claimId
                                - serviceOrderId
                                - orderNumber
                                - customerName
                                - productName
                                - productReferenceId
                                - productListPrice
                                - productPurchasePrice
                                - failureType
                                - failureDescription
                                properties:
                                  contractId:
                                    type: boolean
                                  claimId:
                                    type: boolean
                                  serviceOrderId:
                                    type: boolean
                                  orderNumber:
                                    type: boolean
                                  customerName:
                                    type: boolean
                                  productName:
                                    type: boolean
                                  productReferenceId:
                                    type: boolean
                                  productListPrice:
                                    description: Unit list price of the product, expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul>
                                    type: boolean
                                  productPurchasePrice:
                                    description: Unit purchase price of the product, expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul> <p> Please note that the purchase price should not reflect the quantity as total price
                                    type: boolean
                                  failureType:
                                    type: boolean
                                  failureDescription:
                                    type: boolean
                              replacementFulfillmentMethod:
                                type: string
                                enum:
                                - manual
                                - virtual_card
                                - direct_payment
                                - automated_replacement
                              fulfillmentMethod:
                                type: string
                                enum:
                                - product_replacement
                                - gift_card
                                - virtual_card
                                - direct_payment
                                - carry_in
                                - cleaning_kit
                                - self_repair
                                - replace
                                - repair
                                - repair_depot
                                - repair_onsite
                                - repair_irobot
                                - automated_replacement
                                - store_credit
                                - original_tender
                              shippingAccountOverride:
                                type: object
                                required:
                                - accountId
                                - postalCode
                                - carrier
                                properties:
                                  accountId:
                                    type: string
                                  postalCode:
                                    type: string
                                  carrier:
                                    type: string
                                    enum:
                                    - fedex_ground
                                    - ups_ground
                          rmaNumber:
                            type: string
                          claimType:
                            type: string
                            enum:
                            - shipping_protection
                            - extended_warranty
                          totalItemsValue:
                            type: object
                            required:
                            - amount
                            properties:
                              amount:
                                description: Expressed in terms of the smallest currency unit.<p> <ul><li>$19.99 would be 1999</li><li>1.234,56 € would be 123456</li><li>£ 1,999.99 would be 199999</li></ul>
                                type: number
                                multipleOf: 1
                                minimum: 1
                              currencyCode:
                                type: string
                                enum:
                                - AUD
                                - CAD
                                - EUR
                                - GBP
                                - NZD
                                - USD
                              formattedAmount:
                                type: string
                          costDetails:
                            type: object
                            required:
                            - currencyCode
                            - productCosts
                            properties:
                              currencyCode:
                                type: string
                                enum:
                                - AUD
                                - CAD
                                - EUR
                                - GBP
                                - NZD
                                - USD
                              productCosts:
                                type: array
                                items:
                                  type: object
                                  required:
                                  - productId
                                  - title
                                  - itemValue
                                  - quantity
                                  properties:
                                    productId:
                                      type: string
                                    lineItemId:
                                      type: string
                                    lineItemTransactionId:
                                      type: string
                                    title:
                                      type: string
                                    itemValue:
                                      type: number
                                    contractValue:
                                      type: number
                                    quantity:
                                      type: number
                                    perUnitDiscountAmount:
                                      type: number
                              tax:
                                type: number
                              returnCost:
                                type: number
                              shippingCost:
                                type: number
                          failureType:
                            type: string
                            enum:
                            - road_hazard
                            - electricalFailure
                            - mechanicalFailure
                            - waterDamage
                            - dropped
                            - unanswered
                            - aluminum_finish_scratch
                            - animal_damage
                            - ballpoint_ink_stain
                            - bleach_stain
                            - box_spring_handle_damage
                            - broken_zipper_button
                            - burn
                            - burn_heat_mark
                            - burning_mech_component_damage
                            - color_fade_loss
                            - color_fade_loss_change
                            - electrical_component_damage
                            - electrical_component_failure
                            - fabric_gazebo_cover_sling_frame_damage
                            - finish_check_crack_bubble_peel
                            - fire
                            - foam_loss
                            - food_beverage_stain
                            - frame_damage
                            - frame_spring_mech_motor_lever_damage
                            - human_pet_body_fluid_waste_stain
                            - incline_recline_heat_vibrate_mech_damage
                            - liquid_mark_ring
                            - loose_joint
                            - material_scuffing_scrapes_fraying_pilling
                            - mirror_glass_chip_scratch_break
                            - mirror_silvering_loss
                            - mold_mildew
                            - nail_polish_and_remover_stain_damage
                            - non_damage_breakage
                            - non_fire_burn
                            - odor
                            - other_puncture_tear_rip
                            - other_water_damage
                            - perspiration_hair_body_oils
                            - pet_damage
                            - puncture_cut_tear_rip
                            - rocker_swivel_glide_recline_mech_breakage
                            - rug_fringe
                            - rug_pilling_fraying
                            - scratch_gouge_chip
                            - seam_separation
                            - six_inch_border_tear
                            - spring_coil_puncture_tear_rip
                            - table_arc_umbrella_mech_damage
                            - table_top_breakage
                            - umbrella_rib_damage
                            - vermin
                            - weld_breakage
                      - properties:
                          shippingLabels:
                            type: array
                            items:
                              type: object
                              required:
                              - destinationType
                              - imageData
                              properties:
                                destinationType:
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                    - customer
                                    - servicer
                                imageData:
                                  type: string
                                pdfDownloadUrl:
                                  type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
      operationId: getServiceOrdersSearch
      x-operation-id-source: derived
  /service-orders/service-claim:
    post:
      summary: Submit logistics decisions to continue processing an approved claim
      description: Endpoint for merchants with deferred claim servicing enabled to submit their logistics decisions (field destroy or return) after receiving a claim approval webhook.
      tags:
      - service-orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - claimId
              - logistics
              properties:
                claimId:
                  type: string
                logistics:
                  type: array
                  items:
                    oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                      - type
                      - products
                      properties:
                        type:
                          type: string
                          enum:
                          - field_destroy
                        products:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - merchantLineItemTransactionId
                            properties:
                              productId:
                                type: string
                              extendLineItemId:
                                type: string
                              merchantLineItemTransactionId:
                                type: string
                        rma:
                          type: string
                        returnCost:
                          type: integer
                        shippingCost:
                          type: integer
                        shipping:
                          type: object
                          additionalProperties: false
                          required:
                          - labelUrl
                          - trackingNumber
                          - carrier
                          properties:
                            labelUrl:
                              type: string
                              format: uri
                            trackingNumber:
                              type: string
                            carrier:
                              type: string
                    - type: object
                      additionalProperties: false
                      required:
                      - type
                      - products
                      - shipping
                      properties:
                        type:
                          type: string
                          enum:
                          - return
                        products:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - merchantLineItemTransactionId
                            properties:
                              productId:
                                type: string
                              extendLineItemId:
                                type: string
                              merchantLineItemTransactionId:
                                type: string
                        rma:
                          type: string
                        returnCost:
                          type: integer
                        shippingCost:
                          type: integer
                        shipping:
                          type: object
                          additionalProperties: false
                          required:
                          - labelUrl
                          - trackingNumber
                          - carrier
                          properties:
                            labelUrl:
                              type: string
                              format: uri
                            trackingNumber:
                              type: string
                            carrier:
                              type: string
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=latest
      responses:
        '200':
          description: Servicing request validated and processed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - serviceOrders
                properties:
                  serviceOrders:
                    type: array
                    description: Array of created service orders with their types
                    items:
                      type: object
                      required:
                      - type
                      - serviceOrderId
                      - products
                      properties:
                        type:
                          type: string
                          enum:
                          - field_destroy
                          - return
                        serviceOrderId:
                          type: string
                        rma:
                          type: string
                        products:
                          type: array
                          items:
                            type: object
                            required:
                            - merchantLineItemTransactionId
                            properties:
                              productId:
                                type: string
                              extendLineItemId:
                                type: string
                              merchantLineItemTransactionId:
                                type: string
        '400':
          description: The request to the endpoint was invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
      operationId: postServiceOrdersServiceClaim
      x-operation-id-source: derived
  /service-orders/{serviceOrderId}:
    get:
      summary: Get a service order
      tags:
      - service-orders
      parameters:
      - name: serviceOrderId
        required: true
        in: path
        description: Unique identifier for a service order
        schema:
          type: string
          format: uuid
          example: cc957cb3-3d5d-430b-90a2-9ec96ee4c3cf
      - name: include_shipping_labels
        in: query
        schema:
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: include_events
        in: query
        schema:
          type: string
          example: 'true'
          enum:
          - 'true'
          - 'false'
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend private API key used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=latest
      responses:
        '200':
          description: Returns service order
          content:
            application/json:
              schema:
                type: object
                required:
                - body
                properties:
                  body:
                    allOf:
                    - type: object
                      required:
                      - id
                      - claimId
                      - contractId
                      - sellerId
                      - status
                      - serviceType
                      - product
                      - createdAt
                      - updatedAt
                      - totalItemsValue
                      properties:
                        id:
                          type: string
                        claimId:
                          type: string
                        contractId:
                          type: string
                        sellerId:
                          type: string
                        customerEmail:
                          type: string
                        assignedServicer:
                          type: object
                          required:
                          - servicerId
                          - authOrganizationId
                          - businessName
                          - servicingLocation
                          - servicerType
                          properties:
                            servicerId:
                              type: string
                            authOrganizationId:
                              type: string
                            businessName:
                              type: string
                            contact:
                              type: object
                              properties:
                                email:
