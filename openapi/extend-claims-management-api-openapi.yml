openapi: 3.2.0
info:
  title: Claims Management API
  version: 1.0.0
servers:
- url: https://api.helloextend.com
tags:
- name: Claims Management
paths:
  /claims-management/claims/{claimId}/photos:
    get:
      summary: Get Claim Photos by Claim ID
      description: 'This endpoint returns the current set of photos required or uploaded for a

        given claim. Each call generates fresh presigned URLs for the photos so they

        can be downloaded directly from Extend''s storage.


        Important:


        Presigned URLs returned by this endpoint are short-lived. Fetch the

        response and use the URLs immediately — do not cache them.


        Requests are scoped to the calling merchant. A claim that does not belong

        to the caller''s store will return 403: Forbidden.


        If the claim exists but has no photos, the endpoint returns

        200 with an empty photoDetails array (not a 404).'
      operationId: claimPhotosList
      tags:
      - Claims Management
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: X-Extend-Access-Token
        in: header
        required: true
        description: An Extend Shared Access Token given to external partners used to authenticate requests.
        schema:
          type: string
          example: ExtendAccessToken
      - name: claimId
        in: path
        required: true
        description: Unique identifier for a claim
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - name: X-Extend-Api-Version
        in: header
        required: true
        description: Api Version to use in the request.
        schema:
          type: string
          enum:
          - '2022-02-01'
      responses:
        '200':
          description: Successfully retrieved claim photos
          content:
            application/json:
              schema:
                type: object
                required:
                - photoDetails
                properties:
                  photoDetails:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - status
                      - source
                      - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Unique identifier for the claim photo
                        name:
                          type: string
                          description: File name of the photo
                        description:
                          type: string
                          description: Description of the photo
                        url:
                          type: string
                          format: uri
                          description: Short-lived presigned URL to download the photo. Fetch and use immediately; expires shortly after issuance.
                        source:
                          type: string
                          enum:
                          - chatbot
                          - ops_admin
                          - merchant_ops_admin
                          description: Source through which the photo was uploaded
                        createdBy:
                          type: string
                          description: Identifier of the user or system that uploaded the photo (typically an email)
                        createdAt:
                          type: number
                          description: Unix timestamp (ms) when the photo was created
                        status:
                          type: string
                          enum:
                          - upload_started
                          - saved
                          - deleted
                          - photo_processing_started
                          - rejected
                          - upload_failed
                          description: Current status of the photo
                        requirement:
                          type: object
                          description: Photo requirement this upload satisfies
                          additionalProperties: true
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                required:
                - code
                - message
