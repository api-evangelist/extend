  /shipping-offers/quotes:
    post:
      summary: Create a shipping protection quote
      description: This endpoint calculates the shipping protection premium, i.e. the price you will charge the customer for shipping protection, for eligible products in the specified cart.<p>The response will include the premium and a quote id which must be used to create a valid Order with Extend including shipping protection. An optional array "excluded_products" may contain a list of products that were excluded from the premium calculation if the cart contained products that are not eligible for shipping protection.
      operationId: shippingOffersQuoteCreate
      tags:
      - ShippingOffers
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=2022-02-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - storeId
              - currency
              - items
              properties:
                storeId:
                  type: string
                  description: Unique identifier for a store on Extend
                region:
                  type: string
                  description: Region is used to filter quotes by the region where the customer is located (an ISO 3166-2 region code). <p> If no region is passed, "US" will be used as default region
                  pattern: ^([A-Z]{2})(-([A-Za-z0-9]){0,3})*$
                currency:
