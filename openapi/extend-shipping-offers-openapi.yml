openapi: 3.0.1
info:
  title: Shipping Offers
  version: '2022-02-01'
servers:
- url: https://api.helloextend.com
paths:
  /shipping-offers/config:
    get:
      summary: Get shipping offer config
      description: This endpoint dictates how the shipping protection offer modal should display marketing and compliance text, and includes styling configuration based on attach behavior (i.e. opt in vs. opt out)
      operationId: shippingOffersConfigGet
      tags:
      - ShippingOffers
      parameters:
      - name: Content-Type
        in: header
        required: true
        description: Used to indicate the original media type of the resource (prior to any content encoding applied for sending).
        schema:
          type: string
          example: application/json
      - name: Accept
        in: header
        required: true
        description: Indicates which content types, expressed as MIME types, the client is able to understand, as well as identifies which API version to use in the request.
        schema:
          type: string
          example: application/json; version=2022-02-01
      - name: storeId
        in: query
        required: true
        description: Unique identifier for a store on Extend
        schema:
          type: string
          format: uuid
          example: c57ed096-24ef-49a4-a20a-d1b8bf770980
      - name: locale
        in: query
        description: 'The locale of the customer. Locale is used to determine the language for display and communication. Locale is formatted as xx-XX: the first two letters denote language (ISO 639-1 standards), and the last two letters denote region (ISO 3166 standards).'
        schema:
          type: string
          example: en-US
      responses:
        '200':
          description: Successfully returns config for shipping offers.
          content:
            application/json:
              schema:
                type: object
                required:
                - marketing
                - config
                properties:
                  surfaceVersion:
                    type: object
                    description: Suggested shipping-protection surface throughout customer purchase journey
                    properties:
                      cartOffer:
                        type: object
                        required:
                        - version
                        - content
                        description: Cart offer version
                        properties:
                          version:
                            type: string
                            description: Version of the cart offer surface to be display
                          content:
                            type: string
                            description: Content to be displayed on the cart offer surface
                      learnMoreModal:
                        type: object
                        required:
                        - version
                        - content
                        description: Learn more modal version
                        properties:
                          version:
                            type: string
                            description: Version of the learn more modal surface to be display
                          content:
                            type: string
                            description: Content to be displayed on the learn more modal surface
                  marketing:
                    type: object
                    description: Marketing text to show for various offer types
                    required:
                    - locale
                    - cartOffer
                    - learnMoreModal
                    properties:
                      locale:
                        type: string
                      cartOffer:
                        type: object
                        required:
                        - header
                        - subheader
                        - learnMoreLinkText
                        - extendIconLink
                        description: Text to display on the cart or checkout page offer UI component
                        properties:
                          header:
                            type: string
                          subheader:
                            type: string
                          learnMoreLinkText:
                            type: string
                          extendIconLink:
                            type: string
                          headerWithExtendIconLink:
                            type: string
                      learnMoreModal:
                        type: object
                        description: Text to display in a modal that provides a quick summary about the shipping protection
                        required:
                        - header
                        - subheader
                        - bulletHeader
                        - bullets
                        - extendIconLink
                        - planDetailLinkText
                        - planDetailLink
                        - coverageHeader
                        - coverageItems
                        - disclaimerHeader
                        - disclaimerText
                        properties:
                          header:
                            type: string
                          subheader:
                            type: string
                          extendIconLink:
                            type: string
                          bulletHeader:
                            type: string
                          bullets:
                            type: array
                            description: Array of bullet points of text describing what shipping protection does.
                            items:
                              type: string
                          coverageHeader:
                            type: string
                          coverageItems:
                            type: array
                            description: Array of text and images describing what shipping protection covers (i.e. lost, stolen, and damaged shipments)
                            items:
                              type: object
                              required:
                              - text
                              - description
                              - icon
                              properties:
                                text:
                                  type: string
                                description:
                                  type: string
                                icon:
                                  type: string
                          planDetailLinkText:
                            type: string
                            description: Display text to use for the planDetailsLink hyperlink
                          planDetailLink:
                            type: string
                            description: Web link to see details of the shipping protection plan
                          disclaimerHeader:
                            type: string
                            description: Disclaimer header to be displayed as part of learn more UI component
                          disclaimerText:
                            type: string
                            description: Disclaimer text to be displayed as part of learn more UI component
                      learnMoreModalV2:
                        type: object
                        description: Text to display in a modal that provides a quick summary about the shipping protection for charitiable donations.
                        required:
                        - header
                        - coverageHeader
                        - coverageItems
                        - planDetailLinkText
                        - planDetailLink
                        - whyExtend1Icon
                        - modalImage
                        - disclaimerText
                        properties:
                          header:
                            type: string
                          coverageHeader:
                            type: string
                          coverageItems:
                            type: array
                            description: Array of text and images describing what shipping protection covers (i.e. lost, stolen, and damaged shipments)
                            items:
                              type: object
                              required:
                              - description
                              - icon
                              properties:
                                description:
                                  type: string
                                icon:
                                  type: string
                          planDetailLinkText:
                            type: string
                            description: Display text to use for the planDetailsLink hyperlink
                          planDetailLink:
                            type: string
                            description: Web link to see details of the shipping protection plan
                          whyExtend1Icon:
                            type: string
                          modalImage:
                            type: string
                            description: Relevant image to the right of modal
                          disclaimerText:
                            type: string
                            description: Disclaimer text to be displayed as part of learn more UI component
                      charityDetails:
                        type: array
                        description: Charity details.
                        items:
                          type: object
                          required:
                          - charityModalHeadline
                          - charityModalSubheadline
                          - charityModalImage
                          - charityPlanDetailLinkText
                          - charityModalDisclosureText
                          - charityPlanDetailsLogoImage
                          - charityPlanDetailsImage
                          - charityPlanDetailsHeadline
                          - charityPlanDetailsSubheadline
                          - charityPlanDetailsDisclosureText
                          - charityCartIcon
                          - charityCartSubheader
                          properties:
                            charityModalHeadline:
                              type: string
                            charityModalSubheadline:
                              type: string
                            charityModalImage:
                              type: string
                            charityPlanDetailLinkText:
                              type: string
                            charityModalDisclosureText:
                              type: string
                            charityPlanDetailsLogoImage:
                              type: string
                            charityPlanDetailsImage:
                              type: string
                            charityPlanDetailsHeadline:
                              type: string
                            charityPlanDetailsSubheadline:
                              type: string
                            charityPlanDetailsDisclosureText:
                              type: string
                            charityCartIcon:
                              type: string
                            charityCartSubheader:
                              type: string
                  config:
                    type: object
                    required:
                    - attachBehavior
                    description: Default offer type configuration for attach behavior <p> <uil><li>OPT_IN - UI widget is expected to have consumer turn on shipping protection</li><li>OPT_OUT - UI widget is expected to have shipping protection turned on by default</li><li>OPT_MERCHANT - Shipping protection automatically included by the merchant</li></uil>
                    properties:
                      attachBehavior:
                        type: string
                        enum:
                        - OPT_IN
                        - OPT_OUT
                        - OPT_MERCHANT
        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                type: object
