  /shipping-offers/config/marketing:
    get:
      summary: Get shipping offer marketing text
      description: 'This endpoint dictates how shipping protection offer display units should display marketing and compliance text, and includes styling configuration based on the attach behavior, or offer type.  There are three main offer types: Extend Choice Opt-Out, where shipping protection is selected by default until the customer de-selects it, Extend Choice Opt-In, where the customer must select shipping protection to include it in the order, and Extend Complete, where shipping protection is automatically included by the merchant in every order.'
