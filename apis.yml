aid: extend

name: Extend

description: Extend is a product and shipping protection platform for merchants and ecommerce brands. Its API lets merchants surface extended-warranty
  and shipping-protection offers at checkout and post-purchase, create and manage protection contracts, process orders and line items, file and
  track claims, and manage service orders, refunds, and leads. Extend provides separate demo (sandbox) and production environments, header-based
  date versioning, OAuth2 client-credentials authentication with short-lived access tokens, idempotency keys on writes, and webhooks for claim
  and service-order status changes, alongside client-side SDKs and prebuilt commerce-platform integrations for Shopify, BigCommerce, Magento,
  WooCommerce, and Salesforce Commerce Cloud.

